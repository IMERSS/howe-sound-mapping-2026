# The data files which the project's story page reads at runtime, named once here: R/build.R publishes each from
# tabular_data into static/local/data/tabular, and src/js/storyBuild.js ("npm run story") names them in the layer
# bioreportr.storyData, written into static/story/bioreportr-storyData.vue. The files which only prepare these are
# named in bioreportr-prep.yaml.
# This file is the project's own, and is not copied by copyFrameworkOut.sh
data:
  # The catalogue labelled with the regions its records fall in, and the index of its regions, written by
  # scripts/intersectShapes.R
  labels: AHSBR_Tracheophyta_ultimate-catalogue_2026-06-16-selected-labels.csv
  regionIndirection: AHSBR_Tracheophyta_ultimate-catalogue_2026-06-16-selected-regionIndirection.csv
  # The summary of the catalogue's taxa
  summary: AHSBR_Tracheophyta_ultimate-merged-summary_2026-06-16-prepared-taxa.csv
  # The columnar data package of the three files above, as the tables obs, taxa and regionIndirection, packed from them
  # by R/build.R as the final stage of data preparation, with its details beside it as "-details.viz"
  viz: AHSBR_Tracheophyta_2026-06-16.viz
  # The history of the curatorial notes on each taxon, prepared by scripts/prepare_curation_history.R - published
  curationHistory: AHSBR_Tracheophyta_curation-history_2026-11-15.csv
  # The taxa set aside from the checklist, prepared by scripts/prepare_excluded_taxa.R - published
  excludedTaxa: AHSBR_Tracheophyta_excluded-taxa_2026-11-15.csv
  # The index of the shapes the records are intersected with by scripts/intersectShapes.R - see spatial_data/vectors
  shapeIndex: "Howe Shapefile Index.csv"
